name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 发布产物由两条路径共同拼成，缺任一条「检查更新」都会失败：
#   1. 推送 v* tag 触发本工作流：构建四个平台、签名（.sig）、并生成/合并 latest.json
#   2. 本地 `bun scripts/publish.ts <版本>`：bump 版本、提交、构建并上传 Windows 安装包
#      与 latest.json，随后 push tag 触发本工作流补齐 mac/linux
# 因此本仓库需要配置两个 Secret（与本地 ~/.tauri/silk.key 一致）：
#   TAURI_SIGNING_PRIVATE_KEY          —— 私钥内容或路径
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD —— 私钥口令（--ci 生成的密钥留空即可）
# 同名资产会先删除再上传，所以 CI 覆盖本地已上传的产物是预期行为，
# 前提是两边用同一把签名密钥。

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            bundle_name: macos-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            bundle_name: macos-x64
          - platform: ubuntu-22.04
            args: ""
            bundle_name: linux-x64
          - platform: windows-latest
            args: ""
            bundle_name: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      # 禁用 CRLF 转换：保证迁移文件(.sql)在 Windows runner 上以 LF 检出，
      # 与本地开发环境内嵌的迁移内容字节一致，避免 sqlx 迁移校验和不匹配
      # （"migration X was previously applied but has been modified" 启动崩溃）
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      # 前置校验：没有签名私钥时 tauri-action 会跳过 .sig 与 latest.json 的上传，
      # 构建却是绿色的 —— 结果就是客户端「检查更新」一直拿不到更新清单。
      # 与其产出这种半成品发布，不如在构建前直接失败。
      - name: Verify updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::未配置 Secret TAURI_SIGNING_PRIVATE_KEY，构建产物将不含 .sig 与 latest.json，自动更新不可用。请在仓库 Settings → Secrets and variables → Actions 中补上（内容与本地 ~/.tauri/silk.key 一致）。"
            exit 1
          fi
          echo "签名私钥已配置"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        if: matrix.platform != 'macos-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable for macOS universal targets
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新签名私钥：内容与本地 ~/.tauri/silk.key 一致。
          # 未设置时不会生成 .sig，latest.json 也就没有可下载的更新条目，
          # 客户端的「检查更新」会一直失败。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Silk v__VERSION__
          releaseBody: 请在 Assets 中下载对应平台的桌面安装包。
          releaseDraft: false
          prerelease: false
          tauriScript: bun tauri
          # tauri.release.conf.json 开启 createUpdaterArtifacts，让 CI 产物带 .sig。
          # 该开关放在单独配置里，本地 `bun run tauri build` 才不需要提供私钥。
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          # 与 scripts/publish.ts 保持一致：Windows 更新指向 NSIS 安装包
          # （本地脚本只收集 *-setup.exe）。两者指向不同类型会导致
          # 用 NSIS 安装的用户收到 MSI 更新而安装失败。
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: silk-[version]-${{ matrix.bundle_name }}-[bundle]
